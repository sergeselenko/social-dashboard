<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>TV Social Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f4f1;
        --card: #ffffff;
        --card-2: #ececea;
        --ink: #131518;
        --ink-2: #4c5158;
        --ink-3: #83898f;
        --hairline: rgba(19, 21, 24, 0.09);
        --accent: #b35c1e;
        --accent-ink: #9c4f16;
        --good: #1a7f4b;
        --bad: #c0362c;
        --chip: rgba(19, 21, 24, 0.06);
        --gate-bg: #101215;
        --gate-card: #1a1d21;
        --gate-ink: #f2f3f4;
        --gate-ink-2: #9aa0a6;
        --gate-hairline: rgba(255, 255, 255, 0.12);
        --key: #24282e;
        --key-hover: #2f343b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0d10;
          --card: #14171c;
          --card-2: #1b1f26;
          --ink: #f2f3f4;
          --ink-2: #b7bcc2;
          --ink-3: #7d838c;
          --hairline: rgba(255, 255, 255, 0.09);
          --accent: #e89b4e;
          --accent-ink: #e89b4e;
          --good: #3fbf72;
          --bad: #f0685e;
          --chip: rgba(255, 255, 255, 0.08);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 19px;
        line-height: 1.45;
      }
      button { font: inherit; cursor: pointer; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

      /* ---------- Passcode gate ---------- */
      #gate {
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--gate-bg);
        color: var(--gate-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }
      .gate-inner { width: 100%; max-width: 380px; text-align: center; }
      .gate-title { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
      .gate-sub { color: var(--gate-ink-2); font-size: 17px; margin: 0 0 34px; }
      .dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 34px; min-height: 18px; }
      .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gate-ink-2); transition: background 0.12s ease, border-color 0.12s ease; }
      .dot.filled { background: var(--gate-ink); border-color: var(--gate-ink); }
      .dots.error .dot { border-color: #f0685e; background: #f0685e; }
      .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .key {
        background: var(--key);
        color: var(--gate-ink);
        border: 1px solid var(--gate-hairline);
        border-radius: 16px;
        font-size: 30px;
        font-weight: 600;
        padding: 16px 0 14px;
        line-height: 1.1;
      }
      .key:hover, .key:focus-visible { background: var(--key-hover); }
      .key:active { transform: scale(0.97); }
      .key.util { font-size: 16px; font-weight: 500; color: var(--gate-ink-2); display: flex; align-items: center; justify-content: center; }
      .gate-msg { height: 24px; margin-top: 18px; font-size: 15px; color: #f0685e; }
      @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
      .shake { animation: shake 0.4s ease; }
      @media (prefers-reduced-motion: reduce) {
        .shake { animation: none; }
        .key:active { transform: none; }
      }

      /* ---------- App frame ---------- */
      #app { max-width: 1560px; margin: 0 auto; padding: 28px clamp(18px, 3.5vw, 52px) 64px; }
      .topbar {
        display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
        gap: 14px 28px; padding-bottom: 20px;
      }
      .topbar h1 { font-size: clamp(30px, 3.4vw, 44px); font-weight: 800; letter-spacing: -0.025em; margin: 0; }
      .dateline { color: var(--ink-2); font-size: 18px; font-weight: 500; margin-top: 4px; }
      .top-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
      .clock { font-size: clamp(26px, 2.6vw, 36px); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .fresh { color: var(--ink-3); font-size: 15px; }
      .lock-btn {
        background: var(--chip); color: var(--ink-2); border: none; border-radius: 999px;
        padding: 7px 16px; font-size: 15px; font-weight: 600;
      }
      .lock-btn:hover { color: var(--ink); }

      .draft-note {
        border: 1px solid var(--hairline);
        background: var(--card-2);
        border-radius: 14px;
        padding: 13px 18px;
        font-size: 16px;
        color: var(--ink-2);
        margin-bottom: 26px;
      }
      .draft-note strong { color: var(--ink); font-weight: 700; }

      section.block { margin-bottom: 34px; }
      .block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 4px 12px; }
      .block-head h2 { font-size: 25px; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
      .block-head .hint { color: var(--ink-3); font-size: 15px; font-weight: 500; }
      .card { background: var(--card); border-radius: 20px; overflow: hidden; }

      /* KPI strip: one flat card, hairline-divided cells */
      .kpis { display: grid; grid-template-columns: repeat(4, 1fr); }
      .kpi { padding: 24px 26px 22px; }
      .kpi + .kpi { border-left: 1px solid var(--hairline); }
      .kpi .label { color: var(--ink-2); font-size: 16px; font-weight: 600; }
      .kpi .value { font-size: clamp(38px, 4vw, 58px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
      .kpi .sub { font-size: 16px; color: var(--ink-3); }
      .delta { font-weight: 700; }
      .delta.up { color: var(--good); }
      .delta.down { color: var(--bad); }

      /* Two-up row: posts + chart */
      .two-up { display: grid; grid-template-columns: 1.55fr 1fr; gap: 26px; align-items: start; }
      .two-up section.block { margin-bottom: 0; }

      /* Post rows */
      .post-row {
        display: grid; grid-template-columns: 86px 1fr auto; gap: 6px 18px; align-items: center;
        width: 100%; text-align: left; background: none; border: none; color: inherit;
        padding: 17px 22px; border-top: 1px solid var(--hairline);
      }
      .post-row:first-child { border-top: none; }
      button.post-row:hover, button.channel-row:hover, button.campaign-row:hover { background: var(--card-2); }
      .post-time { color: var(--ink-3); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .post-title { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
      .post-meta { color: var(--ink-3); font-size: 15px; margin-top: 2px; }
      .post-nums { text-align: right; font-variant-numeric: tabular-nums; }
      .post-nums .big { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
      .post-nums .lbl { color: var(--ink-3); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
      .card-foot { padding: 14px 22px; border-top: 1px solid var(--hairline); color: var(--ink-3); font-size: 15px; }

      /* Chart */
      .chart-wrap { padding: 22px 22px 14px; }
      .chart-total { font-size: 15px; color: var(--ink-3); margin-bottom: 10px; }
      .chart-total strong { color: var(--ink); font-size: 19px; }

      /* Channel rows */
      .channel-row {
        display: grid; grid-template-columns: minmax(240px, 1.5fr) repeat(4, minmax(110px, 0.62fr)) 28px;
        gap: 8px 20px; align-items: center;
        width: 100%; text-align: left; background: none; border: none; color: inherit;
        padding: 18px 22px; border-top: 1px solid var(--hairline);
      }
      .channel-row:first-child { border-top: none; }
      .ch-name { display: flex; align-items: center; gap: 13px; min-width: 0; }
      .ch-dot { width: 13px; height: 13px; border-radius: 50%; flex: none; }
      .ch-name .n { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ch-name .h { color: var(--ink-3); font-size: 15px; white-space: nowrap; }
      .ch-stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
      .ch-stat .l { color: var(--ink-3); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
      .chev { color: var(--ink-3); font-size: 22px; text-align: right; }

      /* Campaign row */
      .campaign-row {
        display: grid; grid-template-columns: minmax(260px, 1.4fr) repeat(4, minmax(110px, 0.6fr)) 28px;
        gap: 8px 20px; align-items: center;
        width: 100%; text-align: left; background: none; border: none; color: inherit;
        padding: 20px 22px;
      }
      .status { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: var(--good); }
      .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--good); }

      /* Website strip */
      .site-stats { display: grid; grid-template-columns: repeat(4, 1fr); }
      .site-stat { padding: 20px 24px; }
      .site-stat + .site-stat { border-left: 1px solid var(--hairline); }
      .site-stat .v { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .site-stat .l { color: var(--ink-2); font-size: 15px; font-weight: 600; margin-top: 2px; }

      .foot { color: var(--ink-3); font-size: 15px; padding: 6px 4px 0; max-width: 900px; }
      .foot strong { color: var(--ink-2); }

      /* ---------- Detail view ---------- */
      .back-btn {
        background: var(--chip); border: none; color: var(--ink); border-radius: 999px;
        padding: 9px 18px; font-size: 16px; font-weight: 600; margin-bottom: 20px;
      }
      .detail-head { margin-bottom: 22px; }
      .detail-head .over { color: var(--accent-ink); font-size: 16px; font-weight: 700; }
      .detail-head h2 { font-size: clamp(30px, 3.4vw, 46px); font-weight: 800; letter-spacing: -0.025em; margin: 4px 0 6px; }
      .detail-head .sub { color: var(--ink-2); font-size: 18px; }
      .detail-stats { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 26px; }
      .detail-stats .kpi .value { font-size: clamp(30px, 3vw, 44px); }
      .kv-row { display: flex; justify-content: space-between; gap: 20px; padding: 15px 22px; border-top: 1px solid var(--hairline); font-size: 17px; }
      .kv-row:first-child { border-top: none; }
      .kv-row .k { color: var(--ink-2); font-weight: 500; }
      .kv-row .v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
      .note-text { padding: 18px 22px; color: var(--ink-2); font-size: 17px; }

      [hidden] { display: none !important; }

      /* ---------- Responsive ---------- */
      @media (max-width: 1080px) {
        .two-up { grid-template-columns: 1fr; }
        .two-up section.block { margin-bottom: 34px; }
        .kpis { grid-template-columns: repeat(2, 1fr); }
        .kpi:nth-child(3) { border-left: none; }
        .kpi:nth-child(n+3) { border-top: 1px solid var(--hairline); }
        .detail-stats { grid-template-columns: repeat(2, 1fr); }
        .detail-stats .kpi:nth-child(3) { border-left: none; }
        .detail-stats .kpi:nth-child(n+3) { border-top: 1px solid var(--hairline); }
        .site-stats { grid-template-columns: repeat(2, 1fr); }
        .site-stat:nth-child(3) { border-left: none; }
        .site-stat:nth-child(n+3) { border-top: 1px solid var(--hairline); }
      }
      @media (max-width: 760px) {
        body { font-size: 17px; }
        .channel-row, .campaign-row { grid-template-columns: 1fr 1fr; row-gap: 12px; }
        .channel-row .chev, .campaign-row .chev { display: none; }
        .post-row { grid-template-columns: 1fr auto; }
        .post-time { grid-column: 1 / -1; }
        .top-right { align-items: flex-start; text-align: left; }
      }
    </style>
  </head>

    <!-- ================= Passcode gate ================= -->
    <div id="gate">
      <div class="gate-inner" id="gateInner">
        <h1 class="gate-title">Social Dashboard</h1>
        <p class="gate-sub">Enter the passcode to view</p>
        <div class="dots" id="dots" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="keypad" role="group" aria-label="Passcode keypad">
          <button class="key" data-d="1">1</button>
          <button class="key" data-d="2">2</button>
          <button class="key" data-d="3">3</button>
          <button class="key" data-d="4">4</button>
          <button class="key" data-d="5">5</button>
          <button class="key" data-d="6">6</button>
          <button class="key" data-d="7">7</button>
          <button class="key" data-d="8">8</button>
          <button class="key" data-d="9">9</button>
          <button class="key util" id="keyClear">Clear</button>
          <button class="key" data-d="0">0</button>
          <button class="key util" id="keyBack" aria-label="Backspace">⌫</button>
        </div>
        <p class="gate-msg" id="gateMsg" role="alert"></p>
      </div>
    </div>

    <!-- ================= Dashboard ================= -->
    <div id="app" hidden>
      <header class="topbar">
        <div>
          <h1>Social Dashboard</h1>
          <div class="dateline" id="dateline">—</div>
        </div>
        <div class="top-right">
          <div class="clock" id="clock">—</div>
          <div class="fresh" id="freshLine">Live data · Updated —</div>
          <button class="lock-btn" id="lockBtn">Lock</button>
        </div>
      </header>

      <div class="draft-note" id="liveNote"><strong>Live data.</strong></div>

      <!-- Overview -->
      <main id="overview">
        <section class="block" aria-label="Key numbers, last 7 days">
          <div class="card">
            <div class="kpis" id="kpiStrip"></div>
          </div>
        </section>

        <div class="two-up">
          <section class="block" aria-label="Latest posts">
            <div class="block-head">
              <h2 id="postsHeading">Latest posts</h2>
              <span class="hint">Tap a post for detail</span>
            </div>
            <div class="card">
              <div id="postsList"></div>
              <div class="card-foot" id="postsFoot"></div>
            </div>
          </section>

          <section class="block" aria-label="Views by day">
            <div class="block-head">
              <h2 id="chartTitle">Daily series</h2>
              <span class="hint" id="chartHint"></span>
            </div>
            <div class="card">
              <div class="chart-wrap">
                <div class="chart-total" id="chartTotal"></div>
                <div id="weekChart"></div>
              </div>
            </div>
          </section>
        </div>

        <section class="block" aria-label="Channels" style="margin-top:34px">
          <div class="block-head">
            <h2>Channels</h2>
            <span class="hint" id="channelsHint">Tap a channel for detail</span>
          </div>
          <div class="card" id="channelCard"></div>
        </section>

        <section class="block" aria-label="Advertising">
          <div class="block-head">
            <h2>Ads</h2>
            <span class="hint" id="adsHint">Meta · tap the campaign for detail</span>
          </div>
          <div class="card" id="adsCard"></div>
        </section>

        <section class="block" aria-label="Website">
          <div class="block-head">
            <h2>selenko.com</h2>
            <span class="hint" id="siteHint">GA4</span>
          </div>
          <div class="card">
            <div class="site-stats" id="siteStats"></div>
            <div class="card-foot" id="siteFoot"></div>
          </div>
        </section>

        <p class="foot" id="footText"></p>
      </main>

      <!-- Detail view -->
      <main id="detail" hidden>
        <button class="back-btn" id="backBtn">← Back to overview</button>
        <div id="detailBody"></div>
      </main>
    </div>

      /* ================= Helpers (null-safe: unreported renders as an em dash) ================= */
      function fmt(n) { return (n === null || n === undefined || n === "" || (typeof n === "number" && isNaN(n))) ? "—" : Number(n).toLocaleString("en-US"); }
      function money(n) { return (n === null || n === undefined || isNaN(n)) ? "—" : "$" + Number(n).toFixed(2); }
      function channelById(id) { for (var i = 0; i < CHANNELS.length; i++) if (CHANNELS[i].id === id) return CHANNELS[i]; return null; }
      function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
      function sparklineWide(trend, color) {
        var w = 1120, h = 110, max = Math.max.apply(null, trend), min = Math.min.apply(null, trend);
        var pts = trend.map(function (v, i) {
          var x = (i / (trend.length - 1)) * (w - 24) + 12;
          var y = h - 14 - ((v - min) / (max - min || 1)) * (h - 34);
          return x.toFixed(1) + "," + y.toFixed(1);
        }).join(" ");
        var dotsHtml = trend.map(function (v, i) {
          var x = (i / (trend.length - 1)) * (w - 24) + 12;
          var y = h - 14 - ((v - min) / (max - min || 1)) * (h - 34);
          return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6" fill="' + color + '"/>';
        }).join("");
        return '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" preserveAspectRatio="none" style="display:block;height:110px" aria-hidden="true">' +
          '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' + dotsHtml + "</svg>";
      }
      function metricCell(v, l) { return '<div class="ch-stat"><div class="v">' + v + '</div><div class="l">' + l + "</div></div>"; }

      /* ================= Text updates from DATA ================= */
      function renderTexts() {
        document.getElementById("freshLine").textContent = "Live data · Updated " + DATA.updatedLabel;
        document.getElementById("liveNote").innerHTML = "<strong>Live data.</strong> Updated " + esc(DATA.updatedLabel) + " · Sources: Postiz, Meta Ads, GA4";

        document.getElementById("channelsHint").textContent = "Tap a channel for detail · each figure is that channel's headline metric";
        document.getElementById("adsHint").textContent = "Meta · " + (CAMPAIGN.windowLabel || "") + " · tap the campaign for detail";
        document.getElementById("siteHint").textContent = (SITE.hostLabel || "GA4") + " · " + (SITE.windowLabel || "");

          return '<button class="post-row" data-post="' + p.id + '">' +

      function renderChart() {
        var w = 520, h = 210, base = 168;
        var max = Math.max.apply(null, WEEK.map(function (d) { return d.v; })) * 1.15 || 1;
        var bw = 46, gap = (w - 40 - WEEK.length * bw) / (WEEK.length - 1);
        var svg = '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" role="img" aria-label="Bar chart of the daily series for the last 7 days">';

        WEEK.forEach(function (d, i) {
          var bh = Math.round((d.v / max) * 128);
          var x = 20 + i * (bw + gap), y = base - bh;
          svg += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="6" fill="var(--accent)" opacity="0.9"/>';

        var c = channelById(id);
        if (!c) return;
        var metricVal = (c.views !== null && c.views !== undefined) ? fmt(c.views) : (c.viewsText ? esc(c.viewsText) : "—");
        var html =
          '<div class="detail-head"><div class="over">Channel</div><h2>' + esc(c.name) + '</h2><div class="sub">' + esc(c.handle) + "</div></div>" +
          statsCard([
            [c.id === "youtube" ? "Subscribers" : "Followers", fmt(c.followers), esc(c.followersNote || "not reported by the source")],
            ["Headline metric", metricVal, esc(c.viewsLabel || "")],
            ["Engagement rate", fmt(c.eng), "not reported as a rate"],
            ["Posts · 7 days", fmt(c.posts), ""]
          ]);
        if (c.trend && c.trend.length >= 3) {
          html += '<section class="block"><div class="block-head"><h2>Trend — ' + esc(c.trendLabel || "daily") + '</h2></div><div class="card"><div class="chart-wrap">' +
            sparklineWide(c.trend, c.color) +
            '<div class="chart-total" style="margin-top:14px">From ' + fmt(c.trend[0]) + " on the first day to " + fmt(c.trend[c.trend.length - 1]) + " on the latest day.</div>" +
            "</div></div></section>";
        }
        if (c.recent && c.recent.length) {
          html += '<section class="block"><div class="block-head"><h2>Recent posts</h2></div><div class="card">' + postRows(c.recent) + "</div></section>";
        }
        html += '<section class="block"><div class="block-head"><h2>About this channel</h2></div><div class="card"><p class="note-text">' + esc(c.about) + "</p></div></section>";
        if (c.note) html += '<section class="block"><div class="block-head"><h2>Source notes</h2></div><div class="card"><p class="note-text">' + esc(c.note) + "</p></div></section>";
        openDetail(html);
      }

      function showPost(id) {
        var p = null;
        for (var i = 0; i < POSTS_NOV4.length; i++) if (POSTS_NOV4[i].id === id) p = POSTS_NOV4[i];
        if (!p) return;
        var ch = channelById(p.channel);
        var mainVal = p.views !== null && p.views !== undefined ? fmt(p.views) : fmt(p.impressions);
        var mainLbl = p.views !== null && p.views !== undefined ? "Views" : "Impressions";
        var html =
          '<div class="detail-head"><div class="over">Post · ' + esc(DATA.postsDateLabel) + '</div><h2>' + esc(p.title) + '</h2><div class="sub">' + esc(p.channelLabel || (ch ? ch.name : "")) + " · " + esc(p.format) + "</div></div>" +
          statsCard([
            [mainLbl, mainVal, ""], ["Likes", fmt(p.likes), ""], ["Comments", fmt(p.comments), ""], ["Shares · Saves", fmt(p.shares) + " · " + fmt(p.saves), ""]
          ]) +
          '<section class="block"><div class="block-head"><h2>Notes</h2></div><div class="card"><p class="note-text">' + esc(p.note || "No notes recorded for this post.") + "</p></div></section>" +
          '<section class="block"><div class="card"><div class="kv-row"><span class="k">Channel</span><span class="v">' + esc(p.channelLabel || "") + (ch ? " (" + esc(ch.handle) + ")" : "") + "</span></div>" +
          '<div class="kv-row"><span class="k">Published</span><span class="v">' + esc(DATA.postsDateLabel) + ", 2026</span></div>";
        if (p.url) html += '<div class="kv-row"><span class="k">Post</span><span class="v"><a href="' + esc(p.url) + '" target="_blank" rel="noopener">Open on the platform</a></span></div>';
        html += "</div></section>";
        openDetail(html);
      }

      function showCampaign() {
        openDetail(
          '<div class="detail-head"><div class="over">Ad campaign · Meta</div><h2>' + esc(CAMPAIGN.name) + '</h2><div class="sub">' + esc(CAMPAIGN.platform) + ' · <span class="status">' + esc(CAMPAIGN.status) + "</span> · " + esc(CAMPAIGN.windowLabel || "") + "</div></div>" +
          statsCard([
            ["Spend", money(CAMPAIGN.spend), esc(CAMPAIGN.windowLabel || "")], ["Impressions", fmt(CAMPAIGN.impressions), fmt(CAMPAIGN.reach) + " reach"], ["Link clicks", fmt(CAMPAIGN.clicks), esc(CAMPAIGN.ctr || "") + " CTR · " + money(CAMPAIGN.cpc) + " CPC"], ["Landing views", fmt(CAMPAIGN.landingViews), money(CAMPAIGN.cpl) + " per landing view"]
          ]) +
          '<section class="block"><div class="block-head"><h2>Funnel</h2></div><div class="card">' +
            '<div class="kv-row"><span class="k">Video views</span><span class="v">' + fmt(CAMPAIGN.videoViews) + "</span></div>" +
            '<div class="kv-row"><span class="k">Reach</span><span class="v">' + fmt(CAMPAIGN.reach) + "</span></div>" +
            '<div class="kv-row"><span class="k">Landing page views</span><span class="v">' + fmt(CAMPAIGN.landingViews) + "</span></div>" +
          "</div></section>" +
          '<section class="block"><div class="block-head"><h2>Tracking</h2></div><div class="card">' +
            '<div class="kv-row"><span class="k">UTM tags</span><span class="v">' + esc(CAMPAIGN.utm) + "</span></div>" +
            '<div class="kv-row"><span class="k">Measured in</span><span class="v">Meta Ads · GA4 Selenko Trades property (landing views)</span></div>' +
            '<div class="kv-row"><span class="k">Landing path</span><span class="v">Bio link → links page → HVAC tool</span></div>' +
          "</div></section>" +
          '<section class="block"><div class="block-head"><h2>Notes</h2></div><div class="card"><p class="note-text">' + esc(CAMPAIGN.note) + "</p></div></section>"
        );
      }

      /* ================= Clock & date ================= */
      function tickClock() {
        var now = new Date();
        document.getElementById("clock").textContent = now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
        document.getElementById("dateline").textContent = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
      }
      tickClock();
      setInterval(tickClock, 20000);

      /* ================= Passcode gate (code unchanged: 2023) ================= */
      var CODE = "2023";
      var entered = "";
      var gateEl = document.getElementById("gate");
      var appEl = document.getElementById("app");
      var dotsEl = document.getElementById("dots");
      var msgEl = document.getElementById("gateMsg");
      var gateInner = document.getElementById("gateInner");
      var detailElRef = document.getElementById("detail");

      function paintDots() {
        var dots = dotsEl.children;
        for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("filled", i < entered.length);
      }
      function unlock() {
        try { sessionStorage.setItem("sd-unlocked", "1"); } catch (e) {}
        gateEl.hidden = true;
        appEl.hidden = false;
        window.scrollTo(0, 0);
      }
      function pressDigit(d) {
        if (entered.length >= 4) return;
        entered += d;
        msgEl.textContent = "";
        dotsEl.classList.remove("error");
        paintDots();
        if (entered.length === 4) {
          if (entered === CODE) {
            unlock();
          } else {
            dotsEl.classList.add("error");
            gateInner.classList.remove("shake");
            void gateInner.offsetWidth;
            gateInner.classList.add("shake");
            msgEl.textContent = "That passcode doesn't match — try again.";
            setTimeout(function () { entered = ""; paintDots(); dotsEl.classList.remove("error"); }, 650);
          }
        }
      }
      var keys = document.querySelectorAll(".key[data-d]");
      for (var i = 0; i < keys.length; i++) keys[i].addEventListener("click", function () { pressDigit(this.getAttribute("data-d")); });
      document.getElementById("keyClear").addEventListener("click", function () { entered = ""; msgEl.textContent = ""; dotsEl.classList.remove("error"); paintDots(); });
      document.getElementById("keyBack").addEventListener("click", function () { entered = entered.slice(0, -1); paintDots(); });
      document.addEventListener("keydown", function (e) {
        if (!appEl.hidden) {
          if (e.key === "Escape" && !detailElRef.hidden) closeDetail();
          return;
        }
        if (/^[0-9]$/.test(e.key)) pressDigit(e.key);
        else if (e.key === "Backspace") { entered = entered.slice(0, -1); paintDots(); }
      });
      document.getElementById("lockBtn").addEventListener("click", function () {
        try { sessionStorage.removeItem("sd-unlocked"); } catch (e) {}
        entered = ""; paintDots(); msgEl.textContent = "";
        closeDetail();
        appEl.hidden = true;
        gateEl.hidden = false;
        window.scrollTo(0, 0);
      });
      /* TV reloads in the same session skip the gate */
      try { if (sessionStorage.getItem("sd-unlocked") === "1") { gateEl.hidden = true; appEl.hidden = false; } } catch (e) {}

      /* ================= Init + live refresh ================= */
      function applyData(d) {
        if (!d || !d.channels || !d.campaign) return;
        DATA = d;
        CHANNELS = d.channels; POSTS_NOV4 = d.posts || []; CAMPAIGN = d.campaign;
        WEEK = d.week || []; SITE = d.site || {}; KPIS = d.kpis || [];
        renderTexts(); renderKpis(); renderPosts(); renderChart(); renderChannels(); renderAds(); renderSite();
        if (!document.getElementById("detail").hidden) closeDetail();
      }
      function loadLive() {
        fetch("data.json", { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error("no data.json");
          return r.json();
        }).then(function (d) { applyData(d); }).catch(function () { /* keep embedded fallback */ });
      }
      applyData(DATA);
      loadLive();
      setInterval(loadLive, 30 * 60 * 1000);
    </script>
  </body>
</html>
